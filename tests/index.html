<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Components Preview</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }

      .tabs {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #f5f5f5;
        border-bottom: 2px solid #e0e0e0;
        padding: 0 1rem;
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .tab-buttons {
        display: flex;
      }

      .tab-button {
        padding: 1rem 2rem;
        background: none;
        border: none;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 500;
        color: #666;
        border-bottom: 3px solid transparent;
        transition: all 0.2s ease;
      }

      .tab-button:hover {
        background-color: rgba(0, 0, 0, 0.05);
        color: #333;
      }

      .tab-button.active {
        color: #007bff;
        border-bottom-color: #007bff;
      }

      .theme-button {
        padding: 0.5rem 1rem;
        background-color: #fff;
        border: 1px solid #ccc;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 500;
        transition: all 0.2s ease;
      }

      .theme-button:hover {
        background-color: #f0f0f0;
        border-color: #999;
      }

      .tab-content {
        display: none;
      }

      .tab-content.active {
        display: block;
      }

      /* React 컨테이너를 위한 기본 스타일 */
      #react-root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div class="tabs">
      <div class="tab-buttons">
        <button class="tab-button active" data-tab="lit">
          Lit Components
        </button>
        <button class="tab-button" data-tab="react">
          React Components
        </button>
      </div>
      <button class="theme-button" id="theme-toggle">
        🌙 Dark Mode
      </button>
    </div>

    <div id="lit-tab" class="tab-content active">
      <preview-lit-app></preview-lit-app>
    </div>

    <div id="react-tab" class="tab-content">
      <div id="react-root"></div>
    </div>

    <script type="module">
      import { Theme } from '@iyulab/components/dist/utilities/Theme.js';
      // 탭 전환 기능
      const tabButtons = document.querySelectorAll('.tab-button');
      const tabContents = document.querySelectorAll('.tab-content');

      tabButtons.forEach(button => {
        button.addEventListener('click', () => {
          const tabName = button.getAttribute('data-tab');
          
          // 모든 탭 버튼과 컨텐츠 비활성화
          tabButtons.forEach(btn => btn.classList.remove('active'));
          tabContents.forEach(content => content.classList.remove('active'));
          
          // 선택된 탭 활성화
          button.classList.add('active');
          document.getElementById(`${tabName}-tab`).classList.add('active');
        });
      });

      // 테마 변경 기능
      Theme.init(); // Theme 초기화
      const themeButton = document.getElementById('theme-toggle');

      themeButton.addEventListener('click', () => {
        const theme = Theme.get();
        if (theme === 'dark') {
          Theme.set('light');
          themeButton.textContent = '🌙 Dark Mode';
        } else {
          Theme.set('dark');
          themeButton.textContent = '☀️ Light Mode';
        }
      });
    </script>

    <!-- Lit Preview -->
    <script type="module" src="preview-lit.ts"></script>
    
    <!-- React Preview -->
    <script type="module" src="preview-react.tsx"></script>
  </body>
</html>
